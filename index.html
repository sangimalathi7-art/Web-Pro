<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SuperHero Manager 9000 - ES5</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="mb-4 text-primary">🦸 SuperHero Manager 9000 (ES5)</h1>

    <form id="heroForm" class="row g-3 mb-4">
        <div class="mb-3">
            <input type="text" class="form-control" id="searchName" placeholder="search by hero name">
        </div>
      <div class="col-md-4">
        <input type="text" class="form-control" id="heroName" placeholder="Hero Name" required />
      </div>
      <div class="col-md-4">
        <input type="number" class="form-control" id="heroPower" placeholder="Power Level" required  />
      </div>
      <div class="col-md-4">
        <input type="text" class="form-control" id="secretIdentity" placeholder="Secret Identity" required />
      </div>
      <div class="col-md-2">
      <select class="form-select" id="heroCategory">
    
        <option value="flying">Flying</option>
        <option value="category">Category</option>
        <option value="Speed">Speed</option>
        <option value="Tech">Tech</option>
        <option value="Mystic">Mystic</option>

       </select>
      </div>
      <div class="col-12">
        <button class="btn btn-success" type="submit">Add Hero</button>
      </div>
    </form>

     <div class="mb-3">
        <button class="btn btn-outline-dark btn-sm me-2"onclick="sortHeros(true)">Sort &uarr; Power</button>
        <button class="btn btn-outline-dark btn-sm me-2" onclick="sortHeros(false)"">Sort &darr; Power</button>
        <button class="btn btn-outline-secondary btn-sm me-2">Toggle Dark Mode</button>

     </div>

    <ul class="list-group" id="heroList">
        <!-- <li class="list-group-item d-flex justify-content-between align-items-center"> -->
            <!-- <div>
                <strong>Code Man - Power : 7000</strong> -->
                <!-- <br>
                <small>Secert : No Need GPT</small>
            </div> --> 
            <!-- <div>
                <button class="btn btn-warning btn-sm">Edit</button>
                 <button class="btn btn-danger btn-sm">Remove</button>
            </div> -->
        <!-- </li> -->
    </ul>


  <script src="./scope.js"></script>
</body>
</html>
